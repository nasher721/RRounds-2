name: Toolchain Health

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify baseline npm scripts and lockfile toolchain packages
        run: node scripts/check-toolchain-health.mjs

      # Guards the failure mode that silently invalidated the 2026-08-13
      # sign-off evidence: an upstream publish broke `npm ci` with no repo
      # change. See docs/release/2026-08-11-release-hold-phase0.md.
      - name: Verify lockfile still reproduces
        run: node scripts/check-lockfile-reproducible.mjs
