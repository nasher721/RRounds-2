name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:dist:win:local
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-rounds-windows-x64
          path: app/release/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:dist:mac:local
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-rounds-macos
          path: app/release/*.dmg
          if-no-files-found: error
